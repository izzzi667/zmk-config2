# Left half (central): renders the full nice_oled widget set (WPM, HID,
# modifiers, layer, ...). The defaults (pool 8192, display thread stack 2560)
# leave too little room for LVGL widget creation, which can leave the display
# completely black. Give LVGL and the display thread more memory.
CONFIG_LV_Z_MEM_POOL_SIZE=10000
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096