# ==========================================
# 1. Базовые настройки дисплея
# ==========================================
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Явно включаем базовую поддержку модуля nice_oled (КРИТИЧНО для применения defaults)
CONFIG_NICE_OLED_ON=y

# Явно задаем размеры холста для вертикального OLED (128x32).
# Это предотвращает ошибку "missing expression" из-за отсутствия дефолтов.
CONFIG_NICE_OLED_CUSTOM_CANVAS_WIDTH=32
CONFIG_NICE_OLED_CUSTOM_CANVAS_HEIGHT=128

# ==========================================
# 2. Настройки WPM и Графика (для левой/центральной половины)
# ==========================================
CONFIG_ZMK_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y

# Отключаем конфликтующие виджеты WPM, чтобы освободить память и избежать наложений
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n

# ==========================================
# 3. Настройки периферии (правая половина)
# ==========================================
# Отключаем кота
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n

# ==========================================
# 4. Индикаторы модификаторов (Стиль Windows)
# ==========================================
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

# ==========================================
# 5. Выделение памяти (График требует больше стека)
# ==========================================
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072