# Uncomment the following line to enable the Sofle OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Uncomment these two lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
#CONFIG_ZMK_RGB_UNDERGLOW=y
#CONFIG_ZMK_BACKLIGHT=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
#CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

#CONFIG_ZMK_WIDGET_WPM_STATUS=y
#CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_POINTING=y


# ==========================================
# Включаем модуль WPM на уровне ZMK (без этого виджет не получает данные!)
# ==========================================
CONFIG_ZMK_WPM=y

# ==========================================
# WPM-виджет на центральной (левой) половине
# ==========================================
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE_MAX=100

# Отключаем всё остальное, что может конфликтовать:
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n

# ==========================================
# Правая (периферийная) половина — убираем кота
# ==========================================
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
# Если хотите, чтобы на правой тоже был какой-то виджет, оставьте одну из:
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y

# ==========================================
# Модификаторы — стиль Windows
# ==========================================
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_WINDOWS=y

# ==========================================
# Память (график требует чуть больше стека)
# ==========================================
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072