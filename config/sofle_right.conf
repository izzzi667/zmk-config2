# Right half (peripheral): shows the battery/animation widgets. The default
# 4096 pool / 2560 stack made the screen freeze; more memory plus a slower
# animation (less CPU time, per zmk-nice-oled OPTIMIZE.md) keeps it updating.
CONFIG_LV_Z_MEM_POOL_SIZE=8192
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=3072
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=1500